name = "orion9-r2-brand-uploader"
main = "src/index.ts"
compatibility_date = "2024-04-01"
account_id = "dd579baef921a84503c3989aa829d7d3"

# Cloudflare R2 Bucket Binding for Orion-9 Brand Assets
[[r2_buckets]]
binding = "BRAND_ASSETS"
bucket_name = "orion9-brand-assets"

[vars]
FIREBASE_PROJECT_ID = "orion9-dev-db-2026"
ALLOWED_ORIGINS = "https://orion-9-webos.ai.studio,https://ai.studio,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000"
# Optional: Specify a public delivery custom domain (e.g. "https://brand-assets.orion-9.com" or "https://pub-<hash>.r2.dev")
# If left empty, the Worker automatically serves assets publicly via https://<worker-domain>/cdn/branding/logos/...
R2_PUBLIC_BASE_URL = ""
